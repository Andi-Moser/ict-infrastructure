## M300-1 Proxmox Server -------------------------------------------------------------------------------
server {
   listen 80;
   listen [::]:80;

   server_name m300-1.ict-bz.ch;
   server_tokens off;

   location /.well-known/acme-challenge/ {
       root /var/www/certbot;
   }

   location / {
       return 301 https://m300-1.ict-bz.ch$request_uri;
   }
}

