## Default Server (catch-all for unknown / offline hostnames) ----------------------------------
server {
   listen 80 default_server;
   listen [::]:80 default_server;

   server_name _;
   server_tokens off;

   location /.well-known/acme-challenge/ {
       root /var/www/certbot;
   }

   location / {
       return 444;
   }
}

server {
   listen 443 ssl default_server;
   listen [::]:443 ssl default_server;

   server_name _;
   server_tokens off;

   ssl_reject_handshake on;
}
