## Bookstack Server -------------------------------------------------------------------------------
server {
   listen 80;
   listen [::]:80;

   server_name bookstack.ict-bz.ch;
   server_tokens off;

   location /.well-known/acme-challenge/ {
       root /var/www/certbot;
   }

   location / {
       return 301 https://bookstack.ict-bz.ch$request_uri;
   }
}

server {
   listen 443 ssl;
   listen [::]:443 ssl;

   allow 213.144.139.58;   # Allow this IP
   deny all;              # Deny all other IPs


   server_name bookstack.ict-bz.ch;
   server_tokens off;

   ssl_certificate /etc/nginx/ssl/live/bookstack.ict-bz.ch/fullchain.pem;
   ssl_certificate_key /etc/nginx/ssl/live/bookstack.ict-bz.ch/privkey.pem;
  
   location / {
           proxy_pass       http://bookstack_server;
           proxy_redirect   off;
           proxy_set_header Host              $http_host;
           proxy_set_header X-Real-IP         $remote_addr;
           proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_ssl_verify off;
   }
}

upstream bookstack_server {
   server 10.10.200.120:6875; #ict-edu20
}